<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H+ Sport Products</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">Student starter</p>
    <h1>H+ Sport Products</h1>
    <p>Browse the products provided by your ASP.NET Core API.</p>
  </header>

  <main>
    <section class="panel" aria-labelledby="add-product-heading">
      <h2 id="add-product-heading">Add a product</h2>
      <form id="product-form">
        <label>
          SKU
          <input name="sku" required maxlength="40">
        </label>
        <label>
          Name
          <input name="name" required maxlength="120">
        </label>
        <label class="wide">
          Description
          <input name="description" required maxlength="300">
        </label>
        <label>
          Price
          <input name="price" type="number" min="0" step="0.01" required>
        </label>
        <label>
          Category
          <select name="categoryId" required>
            <option value="1">Active Wear - Men</option>
            <option value="2">Active Wear - Women</option>
            <option value="3">Mineral Water</option>
            <option value="4">Publications</option>
            <option value="5">Supplements</option>
          </select>
        </label>
        <label class="availability">
          <input name="isAvailable" type="checkbox" checked>
          Available
        </label>
        <button type="submit">Add product</button>
      </form>
    </section>

    <section class="products-section" aria-labelledby="products-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Connected to the API</p>
          <h2 id="products-heading">Products</h2>
        </div>
        <button id="refresh-button" class="secondary-button" type="button">
          Refresh
        </button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="products" class="products-grid"></div>
    </section>
  </main>
</body>
</html>
